; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./CoreEntryPoint
lib_dir = ./libraries
; "pio run" e "pio run -t upload" senza -e usano solo questo ambiente
default_envs = teensy31

[env:teensy31]
platform = teensy
board = teensy31
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^6.15.2
	tinkerspy/Automaton@^1.0.3
	seeed-studio/Seeed Arduino LSM6DS3@^2.0.3

; Stesso firmware con gli effetti lama disattivati (comportamento originale).
; Rollback:  pio run -e teensy31_stock -t upload
[env:teensy31_stock]
extends = env:teensy31
build_flags = -D BLADE_EFFECTS_ENABLED=0
